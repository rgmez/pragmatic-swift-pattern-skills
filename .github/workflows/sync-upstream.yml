name: Sync pattern evidence

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Open evidence sync pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out skills repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out pattern evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rgmez/Design-Patterns-in-Swift
          ref: master
          path: upstream
          fetch-depth: 0

      - name: Sync generated references
        run: ruby scripts/sync_from_catalogue.rb --source upstream

      - name: Validate synchronized repository
        run: |
          ruby scripts/validate_skills.rb
          ruby scripts/validate_evals.rb
          ruby scripts/sync_from_catalogue.rb --source upstream --check

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synchronized evidence
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "rgmez"
          git config user.email "rob.gomez.mu@gmail.com"
          git switch -C automation/sync-pattern-catalogue
          git add skills upstream.lock.json
          git commit -m "Update: Sync pattern catalogue evidence"
          git push --force-with-lease origin automation/sync-pattern-catalogue

      - name: Open or reuse synchronization pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view automation/sync-pattern-catalogue --json url >/dev/null 2>&1 || \
            gh pr create \
              --base master \
              --head automation/sync-pattern-catalogue \
              --title "Update: Sync pattern catalogue evidence" \
              --body "Generated references changed because rgmez/Design-Patterns-in-Swift advanced. Review the evidence diff and merge only if the skill instructions still tell the truth."

      - name: Validate synchronization branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run CI --ref automation/sync-pattern-catalogue
