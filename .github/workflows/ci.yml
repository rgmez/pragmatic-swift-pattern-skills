name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and install skills
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out skills repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pattern evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rgmez/Design-Patterns-in-Swift
          ref: master
          path: upstream
          fetch-depth: 0

      - name: Validate skill packages
        run: ruby scripts/validate_skills.rb

      - name: Validate reusable evaluation cases
        run: ruby scripts/validate_evals.rb

      - name: Verify generated evidence is current
        run: ruby scripts/sync_from_catalogue.rb --source upstream --check

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"

      - name: Discover skills through the public CLI
        env:
          DISABLE_TELEMETRY: "1"
        run: npx --yes skills@1.8.1 add . --list

      - name: Smoke-install for Codex, Claude Code, Cursor, and GitHub Copilot
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          mkdir .smoke
          cd .smoke
          npx --yes skills@1.8.1 add .. --skill '*' --agent codex --agent claude-code --agent cursor --agent github-copilot --copy --yes
          for skill in choose-swift-design-pattern implement-swift-design-pattern teach-swift-design-pattern audit-swift-pattern-catalogue; do
            # The CLI uses the shared Agent Skills location for Codex, Cursor,
            # and GitHub Copilot, and a dedicated location for Claude Code.
            test -f ".agents/skills/$skill/SKILL.md"
            test -f ".claude/skills/$skill/SKILL.md"
            diff -qr "../skills/$skill" ".agents/skills/$skill"
            diff -qr "../skills/$skill" ".claude/skills/$skill"
          done
